# LeadPilot — Local development infrastructure
# Runs PostgreSQL and Redis only.
# The apps (backend, frontend) run natively via `turbo dev`.
#
# Credentials are read from environment variables with a local dev fallback.
# For production or shared environments, set these in your shell or a
# .env file before running docker compose up:
#
#   POSTGRES_USER=leadpilot
#   POSTGRES_PASSWORD=<strong-password>
#   POSTGRES_DB=leadpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpilot}
      POSTGRES_DB: ${POSTGRES_DB:-leadpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: leadpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
